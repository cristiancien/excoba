name: Deploy to GitHub Pages

on:
  # Se ejecuta cada vez que haces un push a la rama principal
  push:
    branches: ["main", "master"]
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions
  workflow_dispatch:

# Otorga permisos para subir a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente, saltando las colas en curso
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Subir archivos de la página
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube todos los archivos del directorio actual (ya que tu página no requiere build)
          path: '.'
          
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
